name: Pubblica il sito Labassa
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Scarica i file del repository
        uses: actions/checkout@v4
      - name: Estrai il sito e individua la cartella principale
        run: |
          mkdir extracted public
          unzip Labassa-Web.zip -d extracted
          if [ -f extracted/index.html ]; then
            cp -a extracted/. public/
          else
            index_file=$(find extracted -type f -name index.html -print -quit)
            if [ -z "$index_file" ]; then
              echo "Errore: index.html non trovato nello ZIP" >&2
              exit 1
            fi
            site_dir=$(dirname "$index_file")
            cp -a "$site_dir"/. public/
          fi
          rm -f public/README.md
          touch public/.nojekyll
      - name: Configura GitHub Pages
        uses: actions/configure-pages@v5
      - name: Prepara i file da pubblicare
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Pubblica il sito
        id: deployment
        uses: actions/deploy-pages@v4
