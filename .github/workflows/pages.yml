name: Pubblica il sito Labassa
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Scarica i file del repository
        uses: actions/checkout@v4
      - name: Estrai il sito
        run: |
          mkdir public
          unzip Labassa-Web.zip -d public
          rm -f public/README.md
          touch public/.nojekyll
      - name: Configura GitHub Pages
        uses: actions/configure-pages@v5
      - name: Prepara i file da pubblicare
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Pubblica il sito
        id: deployment
        uses: actions/deploy-pages@v4
